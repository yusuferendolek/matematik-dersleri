<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çarpma ve Bölme Atölyesi – Oyun Defteri</title>
<link rel="stylesheet" href="../ortak/tema.css">
<script src="../ortak/kabuk.js"></script>
<style>
    .oyun { padding: 24px 16px 32px; }

    .atolye {
        max-width: 1040px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr);
        gap: 24px;
        align-items: start;
    }

    /* ---------- işlem alanı: deftere yazılmış gibi ---------- */
    .calisma { container-type: inline-size; min-width: 0; user-select: none; -webkit-user-select: none; }
    .page { display: none; flex-direction: column; align-items: center; gap: 12px; }
    .page.active { display: flex; }

    .sayfa-not { font-size: 15px; font-weight: 700; color: var(--murekkep-2); text-align: center; }
    .sayfa-not .legend-dot { margin-right: 6px; }

    /* --h: bir rakam kutusu = iki defter karesi. Kâğıdın kareleri ortadan başlar ki
       ortalanan işlem (genişliği --h'nin katı) karelerin üstüne otursun. */
    .kagit-alan {
        --h: clamp(30px, calc((100cqw - 8px) / 10), 48px);
        --ic: clamp(2px, calc(var(--h) * .07), 3.5px);
        --s: calc(var(--h) / 2);   /* kâğıdın karesi */
        width: 100%;
        display: flex;
        padding: calc(var(--s) * 2) var(--s);
        background-size: var(--s) var(--s);
        background-position: calc(50% + var(--s) / 2) 0;
        overflow-x: auto;
    }
    /* çarpma kısa ve dar: kutu üç kare, kâğıt yine 24px kareli */
    #multPage .kagit-alan { --h: 72px; --s: calc(var(--h) / 3); background-position: 50% 0; }
    .kagit-alan > * { margin: 0 auto; }

    /* rakam kutuları */
    .digit-cell {
        width: calc(var(--h) - 2 * var(--ic));
        height: calc(var(--h) - 2 * var(--ic));
        margin: var(--ic);
        display: grid;
        place-items: center;
        border: 2px solid var(--kenarlik);
        border-radius: 6px;
        background: var(--yuzey);
        color: var(--mavi);
        font-size: calc(var(--h) * .58);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition: border-color .15s, background-color .15s, box-shadow .15s;
    }
    .digit-cell.carry-cell {
        width: calc(var(--h) * .62);
        height: calc(var(--h) * .62);
        align-self: end;
        margin-bottom: calc(var(--h) * .04);
        font-size: calc(var(--h) * .4);
        border-style: dashed;
        border-color: var(--sari);
        background: color-mix(in srgb, var(--sari) 14%, var(--yuzey));
    }
    .digit-cell.bringdown-cell {
        border-color: color-mix(in srgb, var(--yesil) 70%, transparent);
        background: color-mix(in srgb, var(--yesil) 10%, var(--yuzey));
    }
    .digit-cell.quot-cell {
        border-color: color-mix(in srgb, var(--mavi) 60%, transparent);
        background: color-mix(in srgb, var(--mavi) 8%, var(--yuzey));
    }
    .digit-cell.selected {
        border-style: solid;
        border-color: var(--kalem);
        background: color-mix(in srgb, var(--kalem) 16%, var(--yuzey));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--kalem) 35%, transparent);
    }
    .digit-cell.correct-cell, .digit-cell.selected.correct-cell {
        color: var(--dogru);
        border-color: var(--dogru);
        background: color-mix(in srgb, var(--dogru) 12%, var(--yuzey));
    }
    .digit-cell.wrong-cell, .digit-cell.selected.wrong-cell {
        color: var(--yanlis);
        border-color: var(--yanlis);
        background: color-mix(in srgb, var(--yanlis) 12%, var(--yuzey));
    }

    .static-digit {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        font-size: calc(var(--h) * .66);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--murekkep);
    }

    /* çarpma */
    .mult-grid {
        display: grid;
        grid-template-columns: repeat(3, var(--h));
        grid-template-rows: repeat(3, var(--h)) 0 var(--h);
        place-items: center;
    }
    .mult-divider, .sub-line-bar {
        align-self: start;
        justify-self: stretch;
        height: 3px;
        background: var(--murekkep);
        border-radius: 2px;
        transform: translateY(-50%);
    }
    .mult-divider { grid-column: 1 / -1; }

    /* bölme */
    .long-div-wrapper { display: grid; grid-template-columns: auto auto; align-items: start; }
    .div-steps-col { display: flex; flex-direction: column; }
    .step-row { display: grid; grid-auto-rows: var(--h); place-items: center; }
    .sub-line-row { display: grid; height: 0; }
    .minus-sign {
        justify-self: end;
        padding-right: 2px;
        font-size: calc(var(--h) * .6);
        font-weight: 700;
        line-height: 1;
        color: var(--kirmizi);
    }
    .indir { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
    .arrow-down {
        position: absolute;
        bottom: calc(100% + 1px);
        left: 50%;
        transform: translateX(-50%);
        font-size: calc(var(--h) * .42);
        font-weight: 800;
        line-height: 1;
        color: var(--yesil);
    }
    .div-right-col {
        position: relative;
        margin-left: calc(var(--h) / 2);
        min-width: calc(var(--h) * 2);
        display: flex;
        flex-direction: column;
    }
    /* bölme çizgileri: bölenin solunda dikey, altında yatay kalem çizgisi */
    .div-right-col::before {
        content: "";
        position: absolute;
        left: -1.5px; top: 0;
        width: 3px; height: calc(var(--h) * 2);
        background: var(--murekkep);
        border-radius: 2px;
    }
    .divisor-header {
        position: relative;
        height: var(--h);
        display: flex;
        align-items: center;
        padding-left: calc(var(--h) * .3);
        font-size: calc(var(--h) * .66);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }
    .divisor-header::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -1.5px;
        height: 3px;
        background: var(--murekkep);
        border-radius: 2px;
    }
    .quotient-row { display: flex; height: var(--h); }

    .legend-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 16px;
        font-size: 14px;
        font-weight: 700;
        color: var(--murekkep-2);
    }
    .legend-dot {
        display: inline-block;
        width: 14px; height: 14px;
        margin-right: 5px;
        vertical-align: -2px;
        border: 1.5px solid var(--kenarlik);
        border-radius: 4px;
        background: var(--yuzey);
    }
    .legend-dot.quot { border-color: var(--mavi); background: color-mix(in srgb, var(--mavi) 12%, var(--yuzey)); }
    .legend-dot.bd { border-color: var(--yesil); background: color-mix(in srgb, var(--yesil) 14%, var(--yuzey)); }
    .legend-dot.carry { border: 1.5px dashed var(--sari); background: color-mix(in srgb, var(--sari) 16%, var(--yuzey)); }

    /* ---------- tuş takımı ve kontrol ---------- */
    .kontrol { display: flex; flex-direction: column; gap: 12px; }
    .ipucu-dugme { white-space: normal; line-height: 1.2; padding: 6px 16px; }
    .ipucu-dugme[aria-pressed="true"] {
        border-color: var(--sari);
        background: color-mix(in srgb, var(--sari) 20%, var(--yuzey));
    }
    .step-guide-box {
        display: none;
        padding: 10px 14px;
        border-left: 4px solid var(--sari);
        border-radius: 8px;
        background: color-mix(in srgb, var(--sari) 10%, var(--yuzey));
        font-size: 16px;
        line-height: 1.45;
    }
    .step-guide-box.visible { display: block; }
    #feedbackBox:not(.dogru):not(.yanlis) { display: none; }
    #feedbackBox { font-size: 16px; line-height: 1.4; }

    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; user-select: none; -webkit-user-select: none; }
    .tus { min-height: 52px; padding: 0 8px; font-size: 24px; font-variant-numeric: tabular-nums; }
    .tus-yazi { font-size: 16px; gap: 6px; }
    .tus-yazi .svg { width: 20px; height: 20px; }
    .action-row { display: flex; gap: 8px; }
    .action-row .dugme { flex: 1; }
    .action-row #checkBtn { flex: 2; }

    @media (max-width: 820px) {
        .atolye { grid-template-columns: minmax(0, 1fr); max-width: 640px; gap: 16px; }
        .numpad { grid-template-columns: repeat(6, 1fr); }
        .tus { min-height: 48px; }
    }
    @media (max-width: 560px) {
        .oyun { padding: 14px 12px 20px; }
        /* 1–9 ve 0 iki satırda, Sil ile Sonraki altta geniş */
        .numpad { grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .tus { min-height: 44px; font-size: 21px; }
        .tus-sil { grid-column: 1 / 3; grid-row: 3; }
        .tus-sonraki { grid-column: 3 / 6; grid-row: 3; }
        .kontrol { gap: 10px; }
        .kagit-alan { padding: var(--s); }
        #multPage .kagit-alan { --h: 60px; }
    }
    /* yatay telefon: iki sütun kalır, işlem ve tuşlar sıkılaşır */
    @media (max-height: 520px) and (orientation: landscape) {
        .oyun { padding: 10px 16px 14px; }
        .atolye { grid-template-columns: minmax(0, 1.35fr) minmax(260px, 1fr); max-width: none; gap: 16px; }
        .kagit-alan { --h: clamp(26px, calc((100cqw - 8px) / 10), 30px); padding: var(--s); }
        #multPage .kagit-alan { --h: 54px; }
        .page { gap: 6px; }
        .sayfa-not, .legend-bar { font-size: 13px; }
        .kontrol { gap: 8px; }
        .ipucu-dugme { min-height: 38px; font-size: 14px; }
        .numpad { grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .tus { min-height: 40px; font-size: 20px; }
        .tus-yazi { font-size: 13px; padding: 0 4px; }
        .tus-yazi .svg { display: none; }
        .action-row .dugme { min-height: 40px; }
    }
</style>
</head>
<body class="oyun-sayfasi">
<header class="bar" id="bar">
    <div class="bar-orta">
        <div class="sekmeler" role="tablist" aria-label="İşlem">
            <button class="sekme tab-btn" role="tab" aria-selected="true" onclick="switchTab('mult')">Eldeli çarpma</button>
            <button class="sekme tab-btn" role="tab" aria-selected="false" onclick="switchTab('div')">Adım adım bölme</button>
        </div>
    </div>
    <div class="bar-sag">
        <span class="kalpler" id="heartsDisplay" role="img" aria-label="Kalan can: 3"></span>
        <span class="durum"><span class="durum-ad">Puan</span><b class="durum-deger" id="scoreDisplay">0</b></span>
    </div>
</header>
<script>Kabuk.bar('carpma-bolme');</script>

<main class="oyun">
<div class="atolye">

    <section class="calisma">
        <!-- 1. SAYFA: ELDELİ ÇARPMA -->
        <div id="multPage" class="page active">
            <p class="sayfa-not"><i class="legend-dot carry"></i>Sarı kutuya "elde" değerini yazmayı unutmayın!</p>
            <div class="sahne kagit-alan">
                <div class="mult-grid" id="multGrid"><!-- JS ile doldurulur --></div>
            </div>
        </div>

        <!-- 2. SAYFA: ADIM ADIM UZUN BÖLME -->
        <div id="divPage" class="page">
            <div class="sahne kagit-alan">
                <div class="long-div-wrapper" id="longDivBoard"><!-- JS ile adım adım oluşturulur --></div>
            </div>
            <div class="legend-bar">
                <span><i class="legend-dot quot"></i>Bölüm basamakları</span>
                <span><i class="legend-dot"></i>Çıkarılan / kalan</span>
                <span><i class="legend-dot bd"></i>Yukarıdan indirilen rakam</span>
            </div>
        </div>
    </section>

    <!-- Kontrol ve tuş takımı -->
    <aside class="kontrol panel">
        <button class="dugme ipucu-dugme" id="hintToggleBtn" aria-pressed="false" onclick="toggleHint()">
            <svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
            <span id="hintToggleText">İpucu gösterin (adımları açın)</span>
        </button>

        <div class="step-guide-box" id="stepGuideBox" aria-live="polite">
            Birler basamağını çarparak başlayın!
        </div>

        <div class="geri-bildirim" id="feedbackBox" role="status"></div>

        <div class="numpad">
            <button class="dugme tus" onclick="pressKey('1')">1</button>
            <button class="dugme tus" onclick="pressKey('2')">2</button>
            <button class="dugme tus" onclick="pressKey('3')">3</button>
            <button class="dugme tus" onclick="pressKey('4')">4</button>
            <button class="dugme tus" onclick="pressKey('5')">5</button>
            <button class="dugme tus" onclick="pressKey('6')">6</button>
            <button class="dugme tus" onclick="pressKey('7')">7</button>
            <button class="dugme tus" onclick="pressKey('8')">8</button>
            <button class="dugme tus" onclick="pressKey('9')">9</button>
            <button class="dugme tehlike tus tus-yazi tus-sil" onclick="pressKey('C')" aria-label="Kutuyu silin">
                <svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>Silin
            </button>
            <button class="dugme tus" onclick="pressKey('0')">0</button>
            <button class="dugme tus tus-yazi tus-sonraki" onclick="focusNextInput(1)" aria-label="Sonraki kutu">
                Sonraki<svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </div>

        <div class="action-row">
            <button class="dugme ana buyuk" id="checkBtn" onclick="checkCurrentPage()">Kontrol edin</button>
            <button class="dugme buyuk" id="nextBtn" onclick="generateCurrentPageQuestion()">Yeni soru</button>
        </div>
    </aside>

</div>
</main>

<script>
    let currentTab = 'mult';
    let score = 0;
    let lives = 3;
    let showHint = false;

    // Her iki sayfanın aktif kutu listesi ve durumları
    let multInputs = []; // { id, expected, hint, val }
    let divInputs = [];  // { id, expected, hint, val }
    let activeInputIndex = 0;
    let multSolved = false;
    let divSolved = false;

    // Çarpma soru bilgisi
    let mTop = 0, mBot = 0, mCarry = 0, mProd = 0;
    // Bölme soru bilgisi
    let dDividend = 0, dDivisor = 0;

    let tempRegistry = {};

    // Klavye desteği (açık pencere ya da İçindekiler varken klavye oyuna gitmez)
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (document.querySelector('.pencere-perde') || document.body.classList.contains('cekmece-acik')) return;
        const odak = document.activeElement;
        const baskaDugme = odak && odak.closest && odak.closest('button, a, input') && !odak.closest('.numpad');
        if (e.key >= '0' && e.key <= '9') {
            pressKey(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
            pressKey('C');
        } else if (e.key === 'Enter') {
            if (baskaDugme) return; // odaktaki düğme (Yeni soru, sekme…) kendi işini yapsın
            e.preventDefault();
            checkCurrentPage();
        } else if ((e.key === 'Tab' && !e.shiftKey) || e.key === 'ArrowRight') {
            if (e.key === 'Tab' && baskaDugme) return;
            // son kutudayken Tab tarayıcıya kalır: klavyeyle sekmelere ve düğmelere de ulaşılabilsin
            if (e.key === 'Tab' && activeInputIndex >= getActiveList().length - 1) return;
            e.preventDefault();
            focusNextInput(1);
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            focusNextInput(-1);
        }
    });

    function toggleHint() {
        showHint = !showHint;
        const btn = document.getElementById('hintToggleBtn');
        const box = document.getElementById('stepGuideBox');

        btn.setAttribute('aria-pressed', showHint);
        document.getElementById('hintToggleText').textContent = showHint ? 'İpucunu gizleyin (adımları kapatın)' : 'İpucu gösterin (adımları açın)';
        box.classList.toggle('visible', showHint);
    }

    function getActiveList() {
        return currentTab === 'mult' ? multInputs : divInputs;
    }

    function isCurrentSolved() {
        return currentTab === 'mult' ? multSolved : divSolved;
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.setAttribute('aria-selected', (tab === 'mult' && idx === 0) || (tab === 'div' && idx === 1));
        });

        document.getElementById('multPage').classList.toggle('active', tab === 'mult');
        document.getElementById('divPage').classList.toggle('active', tab === 'div');
        document.getElementById('feedbackBox').className = 'geri-bildirim';

        activeInputIndex = 0;
        refreshFocus();
    }

    function selectBoxById(id) {
        const list = getActiveList();
        const idx = list.findIndex(item => item.id === id);
        if (idx !== -1) {
            activeInputIndex = idx;
            refreshFocus();
        }
    }

    function focusNextInput(step) {
        const list = getActiveList();
        if (list.length === 0) return;
        activeInputIndex = (activeInputIndex + step + list.length) % list.length;
        refreshFocus();
    }

    function refreshFocus() {
        document.querySelectorAll('.digit-cell').forEach(el => el.classList.remove('selected'));
        const list = getActiveList();
        if (list.length === 0) return;

        if (activeInputIndex >= list.length) activeInputIndex = 0;
        const currentItem = list[activeInputIndex];
        const domEl = document.getElementById(currentItem.id);
        if (domEl) domEl.classList.add('selected');

        document.getElementById('stepGuideBox').innerHTML = currentItem.hint;
    }

    function pressKey(key) {
        if (isCurrentSolved()) return;
        const list = getActiveList();
        if (list.length === 0) return;

        const currentItem = list[activeInputIndex];
        const domEl = document.getElementById(currentItem.id);

        if (key === 'C') {
            currentItem.val = '';
            if (domEl) {
                domEl.innerText = '';
                domEl.classList.remove('wrong-cell', 'correct-cell');
            }
            return;
        }

        currentItem.val = key;
        if (domEl) {
            domEl.innerText = key;
            domEl.classList.remove('wrong-cell', 'correct-cell');
        }

        // Otomatik bir sonraki kutuya ilerle
        if (activeInputIndex < list.length - 1) {
            activeInputIndex++;
            refreshFocus();
        }
    }

    function generateCurrentPageQuestion() {
        document.getElementById('feedbackBox').className = 'geri-bildirim';
        if (currentTab === 'mult') {
            generateMultQuestion();
        } else {
            generateDivQuestion();
        }
        activeInputIndex = 0;
        refreshFocus();
    }

    /* =========================================================
       1. SAYFA: ELDELİ ÇARPMA SORU ÜRETİMİ VE ŞEMASI
       ========================================================= */
    function generateMultQuestion() {
        multSolved = false;
        multInputs = [];
        tempRegistry = {};

        // Garantili eldeli çarpma üret (birler basamağı çarpımı >= 10 olsun)
        do {
            mTop = Math.floor(Math.random() * 88) + 12; // 12 - 99
            mBot = Math.floor(Math.random() * 8) + 2;   // 2 - 9
        } while ((mTop % 10) * mBot < 10);

        const ones = mTop % 10;
        const tens = Math.floor(mTop / 10);
        const firstMult = ones * mBot;
        mCarry = Math.floor(firstMult / 10);

        const secondMult = tens * mBot + mCarry;
        mProd = mTop * mBot;

        const grid = document.getElementById('multGrid');
        grid.innerHTML = '';

        // 1. Satır: Elde kutusu (onlar basamağı sütununda: 2. sütun)
        grid.appendChild(createEmptyCell());
        grid.appendChild(createInteractiveCell('m_carry', String(mCarry), 'carry-cell',
            `<b>2. adım (elde):</b> ${ones} × ${mBot} = ${firstMult} işleminden gelen eldeyi (<b>onlar basamağını</b>) sarı kutuya yazın.`));
        grid.appendChild(createEmptyCell());

        // 2. Satır: Üstteki 2 basamaklı çarpan
        grid.appendChild(createEmptyCell());
        grid.appendChild(createStaticDigit(tens));
        grid.appendChild(createStaticDigit(ones));

        // 3. Satır: Çarpı işareti ve 1 basamaklı çarpan
        grid.appendChild(createStaticDigit('×'));
        grid.appendChild(createEmptyCell());
        grid.appendChild(createStaticDigit(mBot));

        // Çizgi
        const line = document.createElement('div');
        line.className = 'mult-divider';
        grid.appendChild(line);

        // 4. Satır: Sonuç kutuları (2 veya 3 basamaklı)
        const prodStr = String(mProd);
        if (prodStr.length === 3) {
            grid.appendChild(createInteractiveCell('m_ans_h', prodStr[0], '',
                `<b>4. adım (yüzler basamağı):</b> ${tens} × ${mBot} + ${mCarry} (elde) = ${secondMult} sonucunun onlar basamağını yüzler basamağına yazın.`));
            grid.appendChild(createInteractiveCell('m_ans_t', prodStr[1], '',
                `<b>3. adım (onlar basamağı):</b> ${tens} × ${mBot} + ${mCarry} (elde) = ${secondMult} sonucunun birler basamağını onlar basamağına yazın.`));
            grid.appendChild(createInteractiveCell('m_ans_o', prodStr[2], '',
                `<b>1. adım (birler basamağı):</b> Önce ${ones} ile ${mBot} rakamını çarpın (${ones} × ${mBot} = ${firstMult}). Birler basamağını buraya yazın.`));

            multInputs = [
                findTempCell('m_ans_o'),
                findTempCell('m_carry'),
                findTempCell('m_ans_t'),
                findTempCell('m_ans_h')
            ];
        } else {
            grid.appendChild(createEmptyCell());
            grid.appendChild(createInteractiveCell('m_ans_t', prodStr[0], '',
                `<b>3. adım (onlar basamağı):</b> ${tens} × ${mBot} + ${mCarry} (elde) = ${secondMult} sonucunu onlar basamağına yazın.`));
            grid.appendChild(createInteractiveCell('m_ans_o', prodStr[1], '',
                `<b>1. adım (birler basamağı):</b> Önce ${ones} ile ${mBot} rakamını çarpın (${ones} × ${mBot} = ${firstMult}). Birler basamağını buraya yazın.`));

            multInputs = [
                findTempCell('m_ans_o'),
                findTempCell('m_carry'),
                findTempCell('m_ans_t')
            ];
        }
    }

    function createInteractiveCell(id, expected, extraClass, hint) {
        const div = document.createElement('div');
        div.id = id;
        div.className = `digit-cell ${extraClass}`.trim();
        div.onclick = () => selectBoxById(id);
        tempRegistry[id] = { id, expected: String(expected), hint, val: '' };
        return div;
    }

    function findTempCell(id) {
        return tempRegistry[id];
    }

    function createStaticDigit(ch) {
        const div = document.createElement('div');
        div.className = 'static-digit';
        div.innerText = ch;
        return div;
    }

    function createEmptyCell() {
        return document.createElement('div');
    }

    /* =========================================================
       2. SAYFA: ADIM ADIM UZUN BÖLME SORU ÜRETİMİ VE ŞEMASI
       ========================================================= */
    function generateDivQuestion() {
        divSolved = false;
        divInputs = [];
        tempRegistry = {};

        // 2, 3 veya 4 basamaklı tamamen karışık seçim
        const choices = [2, 3, 4];
        const numDigits = choices[Math.floor(Math.random() * choices.length)];

        dDivisor = Math.floor(Math.random() * 8) + 2; // 2 - 9

        do {
            if (numDigits === 2) dDividend = Math.floor(Math.random() * 88) + 12;
            else if (numDigits === 3) dDividend = Math.floor(Math.random() * 900) + 100;
            else dDividend = Math.floor(Math.random() * 9000) + 1000;
        } while (dDividend < dDivisor);

        buildLongDivisionDOM(dDividend, dDivisor);
    }

    function buildLongDivisionDOM(dividend, divisor) {
        const board = document.getElementById('longDivBoard');
        board.innerHTML = '';

        const divStr = String(dividend);
        const n = divStr.length;

        // Sol sütun (bölünen + çıkarma satırları)
        const leftCol = document.createElement('div');
        leftCol.className = 'div-steps-col';

        // eksi işareti sütunu yarım kutu, her basamak bir kutu
        const gridTemplate = `calc(var(--h) / 2) repeat(${n}, var(--h))`;

        // En üst satır: bölünen rakamları
        const topRow = document.createElement('div');
        topRow.className = 'step-row';
        topRow.style.gridTemplateColumns = gridTemplate;
        topRow.appendChild(createEmptyCell());
        for (let i = 0; i < n; i++) {
            topRow.appendChild(createStaticDigit(divStr[i]));
        }
        leftCol.appendChild(topRow);

        // Sağ sütun (bölen + bölüm kutuları)
        const rightCol = document.createElement('div');
        rightCol.className = 'div-right-col';

        const divisorHeader = document.createElement('div');
        divisorHeader.className = 'divisor-header';
        divisorHeader.innerText = divisor;
        rightCol.appendChild(divisorHeader);

        const quotRow = document.createElement('div');
        quotRow.className = 'quotient-row';
        rightCol.appendChild(quotRow);

        // İlk basamak bölenden küçükse ilk 2 basamağı birleştirerek başla
        let pos = 0;
        let currentVal = parseInt(divStr[0], 10);
        if (currentVal < divisor && n > 1) {
            pos = 1;
            currentVal = parseInt(divStr.slice(0, 2), 10);
        }

        let stepCount = 1;
        while (pos < n) {
            const qDigit = Math.floor(currentVal / divisor);
            const subVal = qDigit * divisor;
            const remVal = currentVal - subVal;

            // 1) Bölüm kutusu
            const qId = `d_q_${stepCount}`;
            const qCell = createInteractiveCell(
                qId,
                qDigit,
                'quot-cell',
                `<b>Adım ${stepCount} (bölüm):</b> <b>${currentVal}</b> içinde <b>${divisor}</b> kaç kere var? Bölüm kutusuna yazın.`
            );
            quotRow.appendChild(qCell);
            divInputs.push(findTempCell(qId));

            // 2) Çıkarılan sayı satırı (subVal)
            const subStr = String(subVal);
            const subRow = document.createElement('div');
            subRow.className = 'step-row';
            subRow.style.gridTemplateColumns = gridTemplate;

            const endCol = pos + 1;
            const startCol = endCol - subStr.length + 1;

            for (let col = 0; col <= n; col++) {
                if (col === startCol - 1) {
                    const minus = document.createElement('div');
                    minus.className = 'minus-sign';
                    minus.innerText = '−';
                    subRow.appendChild(minus);
                } else if (col >= startCol && col <= endCol) {
                    const charIdx = col - startCol;
                    const sId = `d_sub_${stepCount}_${charIdx}`;
                    const sCell = createInteractiveCell(
                        sId,
                        subStr[charIdx],
                        '',
                        `<b>Adım ${stepCount} (çarpın ve yazın):</b> ${qDigit} × ${divisor} = <b>${subVal}</b> sayısını basamakların altına yazın.`
                    );
                    subRow.appendChild(sCell);
                    divInputs.push(findTempCell(sId));
                } else {
                    subRow.appendChild(createEmptyCell());
                }
            }
            leftCol.appendChild(subRow);

            // Çıkarma çizgisi
            const lineRow = document.createElement('div');
            lineRow.className = 'sub-line-row';
            lineRow.style.gridTemplateColumns = gridTemplate;
            for (let col = 0; col <= n; col++) {
                if (col >= startCol - 1 && col <= Math.min(n, endCol + 1)) {
                    const bar = document.createElement('div');
                    bar.className = 'sub-line-bar';
                    lineRow.appendChild(bar);
                } else {
                    lineRow.appendChild(createEmptyCell());
                }
            }
            leftCol.appendChild(lineRow);

            // 3) Kalan ve (varsa) aşağı indirilen yeni basamak satırı
            const hasNextDigit = (pos + 1) < n;
            const nextDigitChar = hasNextDigit ? divStr[pos + 1] : null;
            const remStr = String(remVal);

            const remRow = document.createElement('div');
            remRow.className = 'step-row';
            remRow.style.gridTemplateColumns = gridTemplate;

            const remStartCol = endCol - remStr.length + 1;

            for (let col = 0; col <= n; col++) {
                if (col >= remStartCol && col <= endCol) {
                    const rIdx = col - remStartCol;
                    const rId = `d_rem_${stepCount}_${rIdx}`;
                    const rCell = createInteractiveCell(
                        rId,
                        remStr[rIdx],
                        '',
                        `<b>Adım ${stepCount} (çıkarma):</b> ${currentVal} − ${subVal} = <b>${remVal}</b> farkını yazın.`
                    );
                    remRow.appendChild(rCell);
                    divInputs.push(findTempCell(rId));
                } else if (hasNextDigit && col === endCol + 1) {
                    const wrap = document.createElement('div');
                    wrap.className = 'indir';

                    const arrow = document.createElement('div');
                    arrow.className = 'arrow-down';
                    arrow.setAttribute('aria-hidden', 'true');
                    arrow.innerText = '↓';
                    wrap.appendChild(arrow);

                    const bId = `d_bd_${stepCount}`;
                    const bCell = createInteractiveCell(
                        bId,
                        nextDigitChar,
                        'bringdown-cell',
                        `<b>Adım ${stepCount} (basamak indirin):</b> Yukarıdaki <b>${nextDigitChar}</b> rakamını yeşil kutuya indirin.`
                    );
                    wrap.appendChild(bCell);
                    remRow.appendChild(wrap);
                    divInputs.push(findTempCell(bId));
                } else {
                    remRow.appendChild(createEmptyCell());
                }
            }
            leftCol.appendChild(remRow);

            if (hasNextDigit) {
                currentVal = remVal * 10 + parseInt(nextDigitChar, 10);
                pos++;
                stepCount++;
            } else {
                break;
            }
        }

        board.appendChild(leftCol);
        board.appendChild(rightCol);
    }

    /* =========================================================
       CEVAP KONTROLÜ, PUAN VE CAN YÖNETİMİ
       ========================================================= */
    function checkCurrentPage() {
        // canlar bittiyse oyun sonu penceresi gelene kadar yeniden kontrol edilmez (can eksiye düşmesin)
        if (isCurrentSolved() || lives <= 0) return;

        const list = getActiveList();
        const fb = document.getElementById('feedbackBox');

        // Boş kutu var mı kontrol et
        const emptyIdx = list.findIndex(item => item.val === '');
        if (emptyIdx !== -1) {
            activeInputIndex = emptyIdx;
            refreshFocus();
            fb.className = 'geri-bildirim yanlis';
            fb.innerHTML = 'Lütfen işlemdeki tüm adım kutularını eksiksiz doldurun!<span>Boş kutuya odaklandım.</span>';
            return;
        }

        // Tüm kutuları doğrula
        let allCorrect = true;
        let firstWrongIdx = -1;

        list.forEach((item, idx) => {
            const domEl = document.getElementById(item.id);
            if (item.val === item.expected) {
                domEl.classList.add('correct-cell');
                domEl.classList.remove('wrong-cell');
            } else {
                allCorrect = false;
                domEl.classList.add('wrong-cell');
                domEl.classList.remove('correct-cell');
                if (firstWrongIdx === -1) firstWrongIdx = idx;
            }
        });

        if (allCorrect) {
            if (currentTab === 'mult') multSolved = true;
            else divSolved = true;

            score += 50;
            updateHeaderUI();
            fb.className = 'geri-bildirim dogru';
            fb.innerHTML = 'Tebrikler! +50 puan!<span>Tüm basamakları ve adımları doğru tamamladınız.</span>';
        } else {
            lives--;
            updateHeaderUI();

            activeInputIndex = firstWrongIdx;
            refreshFocus();

            const wrongItem = list[firstWrongIdx];
            fb.className = 'geri-bildirim yanlis';
            fb.innerHTML = 'Kırmızı işaretli kutularda hata var! 1 can kaybettiniz.' +
                (showHint ? `<span>${wrongItem.hint}</span>` : '<span>Yardım almak için <b>İpucu gösterin</b> butonuna basabilirsiniz.</span>');

            if (lives <= 0) {
                setTimeout(() => {
                    Kabuk.pencere({
                        baslik: 'Oyun bitti',
                        html: `<p>3 canınızı da kullandınız.</p><p>Toplam puanınız: <b id="finalScore">${score}</b></p>`,
                        dugme: 'Yeniden başlayın'
                    }).then(restartGame);
                }, 1300);
            }
        }
    }

    function updateHeaderUI() {
        document.getElementById('scoreDisplay').innerText = score;
        const fullHearts = Math.max(0, lives);
        const hearts = document.getElementById('heartsDisplay');
        hearts.innerHTML = Kabuk.kalpler(fullHearts, 3);
        hearts.setAttribute('aria-label', 'Kalan can: ' + fullHearts);
    }

    function restartGame() {
        score = 0;
        lives = 3;
        updateHeaderUI();
        document.getElementById('feedbackBox').className = 'geri-bildirim';
        generateMultQuestion();
        generateDivQuestion();
        activeInputIndex = 0;
        refreshFocus();
    }

    updateHeaderUI();
    generateMultQuestion();
    generateDivQuestion();
    refreshFocus();
</script>
