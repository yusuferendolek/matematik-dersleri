<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuvarlama Tepesi – Oyun Defteri</title>
<link rel="stylesheet" href="../ortak/tema.css">
<script src="../ortak/kabuk.js"></script>
<style>
    .oyun {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px 16px 24px;
    }

    .instruction { font-size: 24px; font-weight: 700; text-align: center; }
    .instruction b { --fk: var(--k-sayilar); }

    /* Tepe: bütün ölçüler kabın genişliğine göre (1cqw = genişliğin %1'i; orijinal 600px genişlikti) */
    .game-container {
        position: relative;
        width: clamp(300px, min(92vw, (100dvh - 360px) * 1.5), 840px);
        aspect-ratio: 3 / 2;
        container-type: inline-size;
        border-bottom: 1.333cqw solid var(--murekkep);
        margin-bottom: 4cqw;
        flex: none;
    }

    /* Tepe Tasarımı (Yarım Daire) – yeşil kalemle çizilmiş */
    .hill {
        position: absolute;
        bottom: 0;
        left: 8.333cqw;
        width: 83.333cqw;
        height: 41.667cqw;
        border-radius: 41.667cqw 41.667cqw 0 0;
        background: color-mix(in srgb, var(--yesil) 22%, transparent);
        border: .667cqw solid var(--yesil);
        border-bottom: none;
    }

    /* Sayı Etiketleri */
    .label {
        position: absolute;
        z-index: 5;
        font-size: max(15px, 4.27cqw);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1.3;
        background: var(--yuzey);
        padding: .5cqw 2.8cqw;
        border-radius: 1.6cqw;
        border: max(2px, .5cqw) solid currentColor;
    }
    .lower-bound { bottom: -3.4cqw; left: -3.33cqw; color: var(--kirmizi); }
    .upper-bound { bottom: -3.4cqw; right: -3.33cqw; color: var(--mavi); }
    .mid-bound { top: 7cqw; left: 50%; transform: translateX(-50%); color: var(--turuncu); font-size: max(13px, 3.47cqw); }

    /* Yuvarlanma Mekanizması (Sayı doğrusu açısı için CSS Variable tanımlandı) */
    .pendulum {
        --base-angle: 0deg;
        position: absolute;
        left: 50cqw;
        bottom: 0;
        width: 10cqw;
        height: 47.333cqw;
        margin-left: -5cqw;
        transform-origin: bottom center;
        transform: rotate(var(--base-angle));
        z-index: 10;
    }

    /* Yuvarlanan Kaya */
    .rock {
        position: absolute;
        top: 0; left: 0;
        width: 10cqw;
        height: 10cqw;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--yuzey-2);
        border: max(2px, .5cqw) solid var(--murekkep);
        color: var(--murekkep);
        font-size: max(11px, 3.4cqw);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
    }

    /* Giriş Paneli */
    .panel { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .target-number {
        font-size: 34px;
        font-weight: 800;
        color: var(--mor);
        font-variant-numeric: tabular-nums;
        padding-right: 16px;
        border-right: 2px dashed var(--kenarlik);
    }
    #answer { width: 140px; text-align: center; font-size: 24px; }

    #msg { min-height: 28px; font-size: 19px; font-weight: 700; text-align: center; max-width: 60ch; }

    /* Yanlış Cevap Titreme Efekti (Dinamik Açıya Göre Titrer) */
    .shake { animation: shakeAnim 0.5s; }
    @keyframes shakeAnim {
        0%, 100% { transform: rotate(var(--base-angle)); }
        25% { transform: rotate(calc(var(--base-angle) - 8deg)); }
        75% { transform: rotate(calc(var(--base-angle) + 8deg)); }
    }
    .new-record-msg { font-size: 22px; font-weight: 800; color: var(--turuncu); margin-bottom: 8px; }
</style>
</head>
<body class="oyun-sayfasi">
<header class="bar" id="bar">
    <div class="bar-sag">
        <span class="durum"><span class="durum-ad">Puan</span><b class="durum-deger" id="score-display">0</b></span>
        <span class="durum"><span class="durum-ad">Rekor</span><b class="durum-deger" id="highscore-display">0</b></span>
        <span class="durum" aria-label="Kalan can"><span class="kalpler" id="lives-display"></span></span>
    </div>
</header>
<script>Kabuk.bar('yuvarlama-tepesi');</script>

<main class="oyun">
    <div class="instruction" id="instruction">Sayıyı en yakın <b class="fosfor">onluğa</b> yuvarla!</div>

    <div class="game-container">
        <div class="hill">
            <div class="label lower-bound" id="lbl-lower">0</div>
            <div class="label mid-bound" id="lbl-mid">5</div>
            <div class="label upper-bound" id="lbl-upper">10</div>
        </div>

        <div class="pendulum" id="pendulum">
            <div class="rock" id="rock">47</div>
        </div>
    </div>

    <div class="panel">
        <div class="target-number" id="targetNum">47</div>
        <input class="giris" type="number" id="answer" placeholder="Cevap" autocomplete="off" aria-label="Yuvarlanmış sayı">
        <button class="dugme ana buyuk" onclick="checkAnswer()">Yuvarla</button>
    </div>

    <div id="msg" role="status"></div>
</main>

<script>
    let currentNum = 0, lower = 0, upper = 0, mid = 0, isCorrect = 0;
    let roundingMode = "10";
    let score = 0;
    let lives = 3;
    let isRolling = false;

    let highScore = localStorage.getItem("yuvarlamaHighScore") || 0;
    document.getElementById('highscore-display').innerText = highScore;

    const pendulum = document.getElementById('pendulum');
    const rock = document.getElementById('rock');

    function updateLivesUI() {
        document.getElementById('lives-display').innerHTML = Kabuk.kalpler(lives, 3);
    }

    function generateQuestion() {
        if (isRolling) return;

        document.getElementById('answer').value = '';
        document.getElementById('msg').innerText = '';

        const modes = [10, 100, 1000];
        let mode = modes[Math.floor(Math.random() * 3)];
        roundingMode = mode;

        let modName = mode === 10 ? "onluğa" : (mode === 100 ? "yüzlüğe" : "binliğe");
        document.getElementById('instruction').innerHTML = `Sayıyı en yakın <b class="fosfor">${modName}</b> yuvarla!`;

        // Rastgele sayı üret (Tam sınır ve ortaları hariç tutmuyoruz ki 45, 450 gibi sayılar da zirveye otursun)
        do {
            if (mode === 10) currentNum = Math.floor(Math.random() * 89) + 11;
            if (mode === 100) currentNum = Math.floor(Math.random() * 899) + 101;
            if (mode === 1000) currentNum = Math.floor(Math.random() * 8999) + 1001;
        } while (currentNum % mode === 0);

        // Sınırları hesapla
        lower = Math.floor(currentNum / mode) * mode;
        upper = lower + mode;
        mid = lower + (mode / 2);

        isCorrect = (currentNum >= mid) ? upper : lower;

        // Kayanın Tepedeki Konumunu (Sayı Doğrusu) Hesaplama Formülü:
        // P (Yüzde Oranı) = (Sayı - Alt Sınır) / (Üst Sınır - Alt Sınır)
        let percentage = (currentNum - lower) / (upper - lower);
        // Açı -90 (Sol) ile +90 (Sağ) arasında değişir.
        let initialAngle = (percentage * 180) - 90;

        // Animasyonları sıfırlayıp kayayı matematiksel noktaya koyalım
        pendulum.style.transition = 'none';
        rock.style.transition = 'none';

        // Dinamik CSS Değişkeni (Yanlış cevap titremesinde kaymasın diye)
        pendulum.style.setProperty('--base-angle', `${initialAngle}deg`);
        pendulum.style.transform = `rotate(${initialAngle}deg)`;

        // İçindeki yazı ters dönmesin diye kayayı tersine çeviriyoruz
        rock.style.transform = `rotate(${-initialAngle}deg)`;
        pendulum.classList.remove('shake');

        // Arayüze yaz
        document.getElementById('targetNum').innerText = currentNum;
        document.getElementById('lbl-lower').innerText = lower;
        document.getElementById('lbl-upper').innerText = upper;
        document.getElementById('lbl-mid').innerText = mid;
        rock.innerText = currentNum;

        setTimeout(() => document.getElementById('answer').focus(), 100);
    }

    function checkAnswer() {
        if (isRolling) return;
        let userAns = parseInt(document.getElementById('answer').value);
        let msg = document.getElementById('msg');
        let input = document.getElementById('answer');

        if (isNaN(userAns)) return;
        isRolling = true;

        setTimeout(() => {
            if (userAns === isCorrect) {
                // DOĞRU CEVAP
                score += 100;
                document.getElementById('score-display').innerText = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("yuvarlamaHighScore", highScore);
                    document.getElementById('highscore-display').innerText = highScore;
                }

                msg.style.color = 'var(--dogru)';
                let digit = roundingMode === 10 ? "Birler" : (roundingMode === 100 ? "Onlar" : "Yüzler");

                // Fiziksel Yuvarlanma Animasyonu
                pendulum.style.transition = 'transform 1.5s cubic-bezier(0.5, 0, 0.8, 0.2)';
                rock.style.transition = 'transform 1.5s cubic-bezier(0.5, 0, 0.8, 0.2)';

                if (currentNum >= mid) {
                    msg.innerText = `Doğru! ${digit} basamağı 5 veya daha büyük, ileri yuvarlandı.`;
                    pendulum.style.transform = 'rotate(90deg)';
                    rock.style.transform = 'rotate(-360deg)'; // Kendi etrafında dönsün
                } else {
                    msg.innerText = `Doğru! ${digit} basamağı 5'ten küçük, geri yuvarlandı.`;
                    pendulum.style.transform = 'rotate(-90deg)';
                    rock.style.transform = 'rotate(360deg)';
                }

                setTimeout(() => {
                    isRolling = false;
                    generateQuestion();
                }, 3000);

            } else {
                // YANLIŞ CEVAP
                lives--;
                updateLivesUI();

                if (lives <= 0) {
                    gameOver();
                } else {
                    msg.style.color = 'var(--yanlis)';
                    msg.innerText = `Yanlış. Sayının tepedeki yerine tekrar bak! (Kalan can: ${lives})`;

                    // Kaya bulunduğu yamaçta titrer!
                    pendulum.classList.add('shake');
                    input.value = '';
                    input.focus();

                    setTimeout(() => {
                        pendulum.classList.remove('shake');
                        isRolling = false;
                    }, 500);
                }
            }
        }, 100);
    }

    function gameOver() {
        let isNewRecord = score > 0 && score >= highScore;
        Kabuk.pencere({
            baslik: 'Oyun bitti',
            html: `${isNewRecord ? '<p class="new-record-msg">Yeni rekor!</p>' : ''}
                   <p>Toplam puanın: <b>${score}</b></p>
                   <p>En yüksek puan: <b>${highScore}</b></p>`,
            dugme: 'Tekrar oyna'
        }).then(restartGame);
    }

    function restartGame() {
        score = 0;
        lives = 3;
        isRolling = false;
        document.getElementById('score-display').innerText = score;
        updateLivesUI();
        generateQuestion();
    }

    updateLivesUI();
    generateQuestion();
    document.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });
</script>
</body>
</html>
