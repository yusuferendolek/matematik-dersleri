<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açı Dedektifi: Kayıp Açıların İzinde 🕵️‍♂️📐</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

    :root {
      --primary: #6366F1;
      --primary-dark: #4338CA;
      --secondary: #EC4899;
      --accent: #F59E0B;
      --success: #10B981;
      --dark: #0F172A;
      --panel: #1E293B;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      margin: 0;
      padding: 15px;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    #game-card {
      width: 100%;
      max-width: 950px;
      background: var(--panel);
      border: 3px solid #334155;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: #020617;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-bar {
      display: flex;
      gap: 12px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
    }

    nav.stage-tabs {
      display: flex;
      background: #0F172A;
      border-bottom: 2px solid #334155;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 6px;
      border: none;
      background: transparent;
      font-weight: 700;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--panel);
      color: #F43F5E;
      border-bottom: 3px solid #F43F5E;
    }

    #canvas-area {
      position: relative;
      height: 440px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .instruction-box {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 10px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      max-width: 90%;
      text-align: center;
    }

    .instruction-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #F8FAFC;
    }

    #action-bar {
      padding: 18px 24px;
      background: #0F172A;
      border-top: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      min-height: 85px;
    }

    .option-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .opt-btn {
      padding: 12px 24px;
      border: 2px solid #475569;
      border-radius: 16px;
      background: #1E293B;
      font-weight: 700;
      font-size: 1.05rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .opt-btn:hover {
      border-color: var(--primary);
      background: var(--primary);
      transform: translateY(-2px);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="number"] {
      width: 110px;
      padding: 10px;
      border: 2px solid #475569;
      border-radius: 14px;
      background: #0F172A;
      color: white;
      font-size: 1.3rem;
      text-align: center;
      font-weight: 700;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--secondary);
    }

    .btn-submit {
      padding: 12px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      transition: transform 0.15s;
    }

    .btn-submit:active {
      transform: scale(0.96);
    }

    .svg-angle-btn {
      cursor: pointer;
    }

    .svg-angle-btn circle {
      transition: transform 0.2s, fill 0.2s;
      transform-origin: center;
    }

    .svg-angle-btn:hover circle {
      transform: scale(1.25);
      fill: var(--accent) !important;
    }

    .draggable-arm {
      cursor: grab;
    }
    .draggable-arm:active {
      cursor: grabbing;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1E293B;
      border: 2px solid #475569;
      padding: 32px;
      border-radius: 24px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #F8FAFC;
    }

    .modal-body {
      font-size: 1.1rem;
      color: #CBD5E1;
      margin-bottom: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="game-card">
  <header>
    <h1>🕵️‍♂️ Açı Dedektifi</h1>
    <div class="badge-bar">
      <div class="badge">Dedektif Puanı: <span id="score-display">0</span></div>
      <div class="badge">Vaka: <span id="stage-num-display">1</span>/4</div>
    </div>
  </header>

  <nav class="stage-tabs">
    <button class="tab-btn active" onclick="switchStage(1)">Vaka 1: Kimlik Tespiti</button>
    <button class="tab-btn" onclick="switchStage(2)">Vaka 2: Gizli Ölçü</button>
    <button class="tab-btn" onclick="switchStage(3)">Vaka 3: Zıt İkizler (Ters Açı)</button>
    <button class="tab-btn" onclick="switchStage(4)">Vaka 4: Açı Çizim Lab ✏️</button>
  </nav>

  <div id="canvas-area">
    <div class="instruction-box">
      <span style="font-size: 1.8rem;" id="detective-avatar">🔎</span>
      <div class="instruction-text" id="instruction-text">Dedektif, ilk ipucunu incele!</div>
    </div>
    <svg id="svg-board" viewBox="0 0 800 440"></svg>
  </div>

  <div id="action-bar">
    <!-- Şıklar veya girdi alanları buraya dinamik gelir -->
  </div>
</div>

<div class="modal" id="feedback-modal">
  <div class="modal-card">
    <div class="modal-title" id="modal-title">Harika İş! 🔍</div>
    <div class="modal-body" id="modal-body">Vaka başarıyla çözüldü.</div>
    <button class="btn-submit" onclick="closeModal()">Sıradaki Vakaya Geç</button>
  </div>
</div>

<script>
  let currentStage = 1;
  let score = 0;
  let stageData = {};
  let isDraggingArm = false;
  let currentDrawAngle = 30;

  const svgBoard = document.getElementById('svg-board');
  const instructionText = document.getElementById('instruction-text');
  const actionBar = document.getElementById('action-bar');
  const detectiveAvatar = document.getElementById('detective-avatar');

  function init() {
    loadStage(1);
  }

  function switchStage(stageNum) {
    currentStage = stageNum;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx + 1 === stageNum);
    });
    document.getElementById('stage-num-display').innerText = stageNum;
    loadStage(stageNum);
  }

  function loadStage(stageNum) {
    svgBoard.innerHTML = '';
    actionBar.innerHTML = '';

    if (stageNum === 1) renderStage1();
    else if (stageNum === 2) renderStage2();
    else if (stageNum === 3) renderStage3();
    else if (stageNum === 4) renderStage4();
  }

  // --- VAKA 1: KİMLİK TESPİTİ (Semboller & Harfli Gösterimler) ---
  function renderStage1() {
    detectiveAvatar.innerText = "🔎";
    
    // Hem genel adı hem de harfli gösterimleri içerir (örn: AB Işını, [AB] Doğru Parçası)
    const questions = [
      { 
        draw: 'ray', 
        correct: 'AB Işını', 
        options: ['AB Işını', 'AB Doğrusu', '[AB] Doğru Parçası', 'm(AÔB) Açısı'],
        explanation: 'Harika Dedektif! A noktası kapalı, B tarafı ok işaretiyle sonsuza uzandığı için bu bir <b>AB Işını</b>dır.'
      },
      { 
        draw: 'segment', 
        correct: '[AB] Doğru Parçası', 
        options: ['[AB] Doğru Parçası', 'AB Işını', 'AB Doğrusu', 'BA Işını'],
        explanation: 'Doğru Tespit! İki ucu da sınırlı (nokta ile kapalı) olduğu için bu bir <b>[AB] Doğru Parçası</b>dır.'
      },
      { 
        draw: 'line', 
        correct: 'AB Doğrusu', 
        options: ['AB Doğrusu', '[AB] Doğru Parçası', 'AB Işını', 'AÔB Açısı'],
        explanation: 'Süper! İki ucu da ok işaretleriyle sonsuza uzandığı için bu <b>AB Doğrusu</b>dur.'
      },
      { 
        draw: 'angle', 
        correct: 'AÔB Açısı', 
        options: ['AÔB Açısı', '[AB] Doğru Parçası', 'AB Işını', 'AB Doğrusu'],
        explanation: 'Mükemmel! Başlangıç noktası O olan iki ışının oluşturduğu bu açıklık <b>AÔB Açısı</b>dır.'
      }
    ];

    const chosen = questions[Math.floor(Math.random() * questions.length)];
    stageData = { 
      correct: chosen.correct, 
      explanation: chosen.explanation 
    };

    instructionText.innerHTML = `Olay yerindeki şüpheli geometrik yapının <b>SEMBOLİK KİMLİĞİNİ</b> tespit et!`;

    let svgContent = '';
    if (chosen.draw === 'segment') {
      svgContent = `
        <line x1="260" y1="220" x2="540" y2="220" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
        <circle cx="260" cy="220" r="10" fill="#F43F5E"/>
        <circle cx="540" cy="220" r="10" fill="#F43F5E"/>
        <text x="252" y="190" fill="white" font-weight="bold" font-size="22">A</text>
        <text x="532" y="190" fill="white" font-weight="bold" font-size="22">B</text>
      `;
    } else if (chosen.draw === 'ray') {
      svgContent = `
        <line x1="260" y1="220" x2="540" y2="220" stroke="#38BDF8" stroke-width="6"/>
        <circle cx="260" cy="220" r="10" fill="#F43F5E"/>
        <polygon points="555,220 535,210 535,230" fill="#38BDF8"/>
        <text x="252" y="190" fill="white" font-weight="bold" font-size="22">A</text>
        <text x="490" y="190" fill="white" font-weight="bold" font-size="22">B</text>
      `;
    } else if (chosen.draw === 'line') {
      svgContent = `
        <line x1="260" y1="220" x2="540" y2="220" stroke="#38BDF8" stroke-width="6"/>
        <polygon points="245,220 265,210 265,230" fill="#38BDF8"/>
        <polygon points="555,220 535,210 535,230" fill="#38BDF8"/>
        <text x="320" y="190" fill="white" font-weight="bold" font-size="22">A</text>
        <text x="470" y="190" fill="white" font-weight="bold" font-size="22">B</text>
      `;
    } else if (chosen.draw === 'angle') {
      svgContent = `
        <path d="M 400 240 L 560 240 M 400 240 L 510 110" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
        <path d="M 450 240 A 50 50 0 0 0 440 192" fill="none" stroke="#F43F5E" stroke-width="4"/>
        <circle cx="400" cy="240" r="8" fill="#F43F5E"/>
        <text x="375" y="265" fill="white" font-weight="bold" font-size="22">O</text>
        <text x="560" y="265" fill="white" font-weight="bold" font-size="22">B</text>
        <text x="515" y="100" fill="white" font-weight="bold" font-size="22">A</text>
      `;
    }
    svgBoard.innerHTML = svgContent;

    let optsHtml = '<div class="option-group">';
    chosen.options.forEach(opt => {
      optsHtml += `<button class="opt-btn" onclick="checkStage1('${opt}')">${opt}</button>`;
    });
    optsHtml += '</div>';
    actionBar.innerHTML = optsHtml;
  }

  function checkStage1(ans) {
    if (ans === stageData.correct) {
      score += 25;
      updateScore();
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
      showModal("İz Bulundu! 🔍", stageData.explanation, true);
    } else {
      showModal("İz Kaçtı! ❌", "Dikkat et Dedektif! Sembolün ışın mı, doğru parçası mı yoksa açı mı bildirdiğini harflerden ve oklardan kontrol et.", false);
    }
  }

  // --- VAKA 2: GİZLİ ÖLÇÜ ---
  function renderStage2() {
    detectiveAvatar.innerText = "🕵️‍♂️";
    const isComp = Math.random() > 0.5;
    
    if (isComp) {
      const known = Math.floor(Math.random() * 5) * 10 + 20;
      const target = 90 - known;
      stageData = {
        correct: target,
        explanation: `Süper Mantık! 💡 Dik açı (90 derece) referansına göre gizli açının ölçüsü: 90 - ${known} = <b>${target} derece</b> olarak bulunur.`
      };

      instructionText.innerHTML = `Dik açının (90 derece) bir parçası <b>${known} derece</b> olarak ölçüldü. <b>KAYIP PARÇANIN</b> ölçüsü kaç derecedir?`;
      drawCompVisual(known);
    } else {
      const known = Math.floor(Math.random() * 8) * 10 + 40;
      const target = 180 - known;
      stageData = {
        correct: target,
        explanation: `Mükemmel Hesap! 🎯 Doğru açı (180 derece) üzerindeki gizli komşu açının ölçüsü: 180 - ${known} = <b>${target} derece</b> olarak bulunur.`
      };

      instructionText.innerHTML = `Doğru açının (180 derece) bir parçası <b>${known} derece</b> ise, ona komşu olan <b>BÜTÜNLER AÇISINI</b> bul!`;
      drawSuppVisual(known);
    }

    actionBar.innerHTML = `
      <div class="input-row">
        <label for="degree-in" style="font-weight: 700; font-size: 1.1rem;">Kayıp Açı (derece):</label>
        <input type="number" id="degree-in" placeholder="Örn: 40" min="0" max="180">
        <button class="btn-submit" onclick="checkStage2Input()">Vakayı Çöz</button>
      </div>
    `;
  }

  function drawCompVisual(known) {
    const cx = 400, cy = 290, len = 170;
    const rad = (known * Math.PI) / 180;
    const rx = cx + len * Math.cos(rad);
    const ry = cy - len * Math.sin(rad);

    let svgContent = `
      <path d="M ${cx+24} ${cy} L ${cx+24} ${cy-24} L ${cx} ${cy-24}" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <line x1="${cx}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#38BDF8" stroke-width="5"/>
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - len}" stroke="#38BDF8" stroke-width="5"/>
      <line x1="${cx}" y1="${cy}" x2="${rx}" y2="${ry}" stroke="#F43F5E" stroke-width="5"/>

      <path d="M ${cx+50} ${cy} A 50 50 0 0 0 ${cx + 50*Math.cos(rad)} ${cy - 50*Math.sin(rad)}" fill="rgba(244, 63, 94, 0.25)" stroke="#F43F5E" stroke-width="3"/>
      <text x="${cx + 65}" y="${cy - 15}" fill="#F43F5E" font-weight="bold" font-size="18">${known} derece</text>
      
      <text x="${cx + 25}" y="${cy - 65}" fill="#F59E0B" font-weight="bold" font-size="28">?</text>
    `;
    svgBoard.innerHTML = svgContent;
  }

  function drawSuppVisual(known) {
    const cx = 400, cy = 280, len = 170;
    const rad = (known * Math.PI) / 180;
    const rx = cx - len * Math.cos(rad);
    const ry = cy - len * Math.sin(rad);

    let svgContent = `
      <line x1="${cx - len}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#38BDF8" stroke-width="5"/>
      <line x1="${cx}" y1="${cy}" x2="${rx}" y2="${ry}" stroke="#F43F5E" stroke-width="5"/>

      <text x="${cx - 85}" y="${cy - 30}" fill="#F43F5E" font-weight="bold" font-size="18">${known} derece</text>
      <text x="${cx + 45}" y="${cy - 30}" fill="#F59E0B" font-weight="bold" font-size="28">?</text>
    `;
    svgBoard.innerHTML = svgContent;
  }

  function checkStage2Input() {
    const val = parseInt(document.getElementById('degree-in').value);
    if (isNaN(val)) return;

    if (val === stageData.correct) {
      score += 30;
      updateScore();
      confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      showModal("Vaka Çözüldü! 🎉", stageData.explanation, true);
    } else {
      showModal("Yanlış İpucu ❌", "Hesaplamanı tekrar yap Dedektif! Tümler açılar 90 dereceye, bütünler açılar ise 180 dereceye tamamlar.", false);
    }
  }

  // --- VAKA 3: ZIT İKİZLER (Ters Açı) ---
  function renderStage3() {
    detectiveAvatar.innerText = "🔍";
    const anglePairs = { 'A': 'D', 'B': 'E', 'C': 'F', 'D': 'A', 'E': 'B', 'F': 'C' };
    const angleValues = { 'A': 45, 'B': 75, 'C': 60, 'D': 45, 'E': 75, 'F': 60 };

    const keys = ['A', 'B', 'C', 'D', 'E', 'F'];
    const target = keys[Math.floor(Math.random() * keys.length)];
    const correctOpposite = anglePairs[target];
    const val = angleValues[target];

    stageData = {
      target: target,
      correctOpposite: correctOpposite,
      val: val,
      explanation: `Tebrikler Dedektif! <b>${target}</b> açısı (${val} derece) ile tam zıt yönündeki <b>${correctOpposite}</b> açısı <b>Zıt İkizlerdir (Ters Açılardır)</b> ve ölçüleri birbirine eşittir (${val} derece).`
    };

    instructionText.innerHTML = `Zanlı <b>${target}</b> açısı (${val} derece)! Onunla tam zıt yönde olan <b>ZIT İKİZİNİ (Ters Açısını)</b> yakala!`;

    draw3LineIntersection(target);
    actionBar.innerHTML = `<div style="color: #94A3B8; font-weight: 700; font-size: 1.05rem;">Şekil üzerindeki harf butonuna tıklayarak zıt ikizi seç!</div>`;
  }

  function draw3LineIntersection(highlightLetter) {
    const cx = 400, cy = 220, len = 190;

    let svgContent = `
      <line x1="${cx - len}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#475569" stroke-width="5"/>
      <line x1="${cx - len*Math.cos(45*Math.PI/180)}" y1="${cy + len*Math.sin(45*Math.PI/180)}" x2="${cx + len*Math.cos(45*Math.PI/180)}" y2="${cy - len*Math.sin(45*Math.PI/180)}" stroke="#475569" stroke-width="5"/>
      <line x1="${cx - len*Math.cos(120*Math.PI/180)}" y1="${cy + len*Math.sin(120*Math.PI/180)}" x2="${cx + len*Math.cos(120*Math.PI/180)}" y2="${cy - len*Math.sin(120*Math.PI/180)}" stroke="#475569" stroke-width="5"/>
      <circle cx="${cx}" cy="${cy}" r="8" fill="#6366F1"/>
    `;

    const labels = [
      { id: 'A', x: cx + 70, y: cy - 22 },
      { id: 'B', x: cx + 30, y: cy - 65 },
      { id: 'C', x: cx - 50, y: cy - 40 },
      { id: 'D', x: cx - 70, y: cy + 22 },
      { id: 'E', x: cx - 30, y: cy + 65 },
      { id: 'F', x: cx + 50, y: cy + 40 }
    ];

    labels.forEach(l => {
      const isTarget = (l.id === highlightLetter);
      const strokeColor = isTarget ? "#F43F5E" : "#6366F1";
      svgContent += `
        <g class="svg-angle-btn" onclick="handleAngleClick('${l.id}')">
          <circle cx="${l.x}" cy="${l.y}" r="18" fill="${strokeColor}" stroke="white" stroke-width="3"/>
          <text x="${l.x}" y="${l.y + 6}" fill="white" font-weight="bold" font-size="15" text-anchor="middle">${l.id}</text>
        </g>
      `;
    });

    svgBoard.innerHTML = svgContent;
  }

  function handleAngleClick(clickedId) {
    if (clickedId === stageData.correctOpposite) {
      score += 25;
      updateScore();
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
      showModal("Zıt İkiz Yakalandı! 🌟", stageData.explanation, true);
    } else {
      showModal("Yanlış Şüpheli! ❌", `Seçtiğin ${clickedId} açısı ters açı değildir. Sorulan ${stageData.target} açısının tam karşısında (zıt yönünde) kalan açıyı seç!`, false);
    }
  }

  // --- VAKA 4: İNTERAKTİF AÇI ÇİZİM LABORATUVARI (Gizli Ölçü Modu) ---
  function renderStage4() {
    detectiveAvatar.innerText = "✏️";
    const baseVal = Math.floor(Math.random() * 5) * 10 + 20; // 20-60 arası
    const targetDrawAngle = 90 - baseVal; // Öğrencinin çizmesi gereken tümler açı

    stageData = {
      targetDrawAngle: targetDrawAngle,
      baseVal: baseVal,
      explanation: `İnanılmaz Çizim Dedektif! 🎨 ${baseVal} derecelik açının tümler açısı olan <b>${targetDrawAngle} derece</b>lik açıyı kusursuz şekilde çizdin!`
    };

    currentDrawAngle = 10; // Başlangıç kol açısı

    instructionText.innerHTML = `Dedektif Çizim Labı: <b>${baseVal} derece</b>lik açının <b>TÜMLERİNİ</b> bulup çizmek için kırmızı kolu sürükle!`;

    drawInteractiveLab();

    actionBar.innerHTML = `
      <div style="display:flex; align-items:center; gap:15px;">
        <span style="font-weight:700; font-size:1.15rem; color:#F59E0B;">Kolu sürükleyerek açıyı oluştur!</span>
        <button class="btn-submit" onclick="checkDrawAnswer()">Çizimi Onayla</button>
      </div>
    `;

    setupArmDrag();
  }

  function drawInteractiveLab() {
    const cx = 350, cy = 290, len = 200;
    const rad = (currentDrawAngle * Math.PI) / 180;
    const rx = cx + len * Math.cos(rad);
    const ry = cy - len * Math.sin(rad);

    let svgContent = `
      <!-- Diklik Referans Çizgisi -->
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - len}" stroke="#475569" stroke-width="3" stroke-dasharray="6,6"/>
      <text x="${cx - 20}" y="${cy - len - 10}" fill="#94A3B8" font-weight="bold" font-size="14">90 derece</text>

      <!-- Sabit Taban Kolu -->
      <line x1="${cx}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>

      <!-- Dynamic Arc -->
      <path d="M ${cx+60} ${cy} A 60 60 0 0 0 ${cx + 60*Math.cos(rad)} ${cy - 60*Math.sin(rad)}" fill="rgba(244, 63, 94, 0.2)" stroke="#F43F5E" stroke-width="4"/>

      <!-- Hareketli Kol -->
      <g class="draggable-arm" id="arm-group">
        <line x1="${cx}" y1="${cy}" x2="${rx}" y2="${ry}" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
        <circle cx="${rx}" cy="${ry}" r="14" fill="#F43F5E" stroke="white" stroke-width="3"/>
      </g>

      <circle cx="${cx}" cy="${cy}" r="8" fill="#F59E0B"/>
    `;

    svgBoard.innerHTML = svgContent;
  }

  function setupArmDrag() {
    const handleMove = (e) => {
      if (!isDraggingArm) return;
      const rect = svgBoard.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      const cx = 350, cy = 290;
      const svgX = (clientX - rect.left) * (800 / rect.width);
      const svgY = (clientY - rect.top) * (440 / rect.height);

      const dx = svgX - cx;
      const dy = cy - svgY;

      let angle = Math.round((Math.atan2(dy, dx) * 180) / Math.PI);
      if (angle < 0) angle = 0;
      if (angle > 90) angle = 90;

      currentDrawAngle = angle;
      drawInteractiveLab();
      setupArmDrag();
    };

    const arm = document.getElementById('arm-group');
    if (arm) {
      arm.onmousedown = () => isDraggingArm = true;
      arm.ontouchstart = () => isDraggingArm = true;
    }

    window.onmousemove = handleMove;
    window.ontouchmove = handleMove;
    window.onmouseup = () => isDraggingArm = false;
    window.ontouchend = () => isDraggingArm = false;
  }

  function checkDrawAnswer() {
    const diff = Math.abs(currentDrawAngle - stageData.targetDrawAngle);
    if (diff <= 4) { // Tolerans aralığı
      score += 35;
      updateScore();
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      showModal("Mükemmel Çizim! 🎨", stageData.explanation, true);
    } else {
      showModal("Açı Ölçüsü Hatalı ❌", `Çizdiğin açı ${currentDrawAngle} derece oldu. ${stageData.baseVal} derecelik açının tümlerini (90 dereceye tamamlayan açıyı) bulup kolu tekrar ayarla!`, false);
    }
  }

  function updateScore() {
    document.getElementById('score-display').innerText = score;
  }

  function showModal(title, body, isSuccess) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-body').innerHTML = body;
    const modal = document.getElementById('feedback-modal');
    modal.classList.add('active');
    modal.dataset.isSuccess = isSuccess;
  }

  function closeModal() {
    const modal = document.getElementById('feedback-modal');
    modal.classList.remove('active');
    if (modal.dataset.isSuccess === 'true') {
      loadStage(currentStage);
    }
  }

  window.onload = init;
</script>
</body>
</html>
